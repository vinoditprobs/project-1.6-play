<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Project 1.6 — Elevator Game Prototype</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="game" id="game">
        <div id="scene"></div>
        <!-- <div class="topNote">PROJECT 1.6 • THE ELEVATOR PITCH</div> -->
        <div class="ui" id="ui">
            <section class="panel">
                <div class="stage" id="stage"></div>
                <div class="screen" id="screen">
                    <div class="screen_header">
                        <div class="lift-arrows" aria-hidden="true">
                            <span></span><span></span><span></span>
                        </div>
                        <div class="current-floor" id="currentFloor">0</div>
                    </div>
                    <div id="screenContent" class="screen-content"></div>
                    <div class="screen_footer">
                        <div class="leftStat" id="leftStat"></div>
                        <div class="rightStat" id="rightStat"></div>
                    </div>
                </div>
                <div class="floorbar" id="floorbar"><span class="floor-label">Floor<br>Number</span>
                <div class="floor-badges">
                    <span
                        class="floor-badge">0</span><span class="floor-badge">1</span><span
                        class="floor-badge">2</span><span class="floor-badge">3</span>
                </div>    
                </div>
            </section>
        </div>
        <div class="start hide" id="start">
            <div class="start-card hide" id="start-card">
                <div id="startIntro">
                    <h1>THE SKINCARE LIFT</h1>
                    <p>Pitch your skincare brand to Riya before her floor arrives. Choose carefully, manage your coins and
                        keep an eye on the timer.</p><button class="go" id="begin">Start Game</button>
                </div>
                <div id="startContent" class="start-content"></div>
                <div id="endContent" class="end-content">
                    <div class="title">Game Over!</div>
                    <img class="completion-stars" src="images/stars.png" width="110" height="42" alt="Achievement stars">
                    <button class="go" data-action="restart">Play Again</button>
                </div>
            </div>
        </div>
        <div class="timeout-popup hide" id="timeoutPopup" role="dialog" aria-modal="true" aria-labelledby="timeoutTitle">
            <div class="timeout-backdrop"></div>
            <div class="timeout-card">
                <img src="images/times-up.png" width="220" height="360" alt="Riya leaving the elevator">
                <div class="timeout-copy">
                    <h2 id="timeoutTitle">Time's Up!</h2>
                    <p>Riya left the elevator before you could finish your pitch.</p>
                    <button class="go" id="retryTimeout">Try Again</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scene and character templates -->
    <template id="scene-lobby">
        <div class="lobby lobby-image">
            <div class="lift_lobby" >
                <img class="door-shadow" src="images/lift-lobby-bg-door-shadow.png" width="1440" height="800" alt="Lift lobby without shadow">
            <img class="without-door" src="images/lift-lobby-bg-without-door.png" width="1440" height="800" alt="Lift lobby without door">
            <span class="doors" >
                <img class="left-door" src="images/lift-lobby-bg-left-door.png" width="1440" height="800" alt="Left door">
                <img class="right-door" src="images/lift-lobby-bg-right-door.png" width="1440" height="800" alt="Right Door">
            </span>
            <img src="images/lift-lobby-bg.png" width="1440" height="800" alt="Lift lobby background">
            </div>
        </div>
    </template>
    <template id="scene-inside">
        <div class="inside lift-inside"><img src="images/lift-inside-background.png" width="1440" height="800" alt="Lift Inside background"></div>
    </template>
    <template id="coin"><img class="coin" src="images/coin.png" width="19" height="19" alt=""></template>
    <template id="timer-icon"><img class="timer-icon" src="images/timer.png" width="18" height="18" alt=""></template>
    <div hidden id="bubble-data">
        <template data-screen="2">
            <div class="bubble left round">You are the founder of a new skincare brand.
                SKINNS</div>
        </template><template data-screen="3">
            <div class="bubble right round">This is Riya, your potential investor.
                And a beauty retail store owner.</div>
        </template>
        <template data-screen="6">
            <div class="bubble left round">Hey Riya,
                Do you have minute?</div>
            <div class="bubble right round">Hello, I’m in a rush but tell me.</div>
        </template><template data-screen="7">
            <div class="bubble left round">Make your USP clear.</div>
            <div class="bubble right round">I’m listening.</div>
        </template>
        <template data-screen="8">
            <div class="bubble right thought">Great but I hear that a lot. My floor’s here, Bye!</div>
        </template><template data-screen="9">
            <div class="bubble right round">Hmm...That sounds interesting. You have my attention.</div>
        </template><template data-screen="10">
            <div class="bubble right round">Do you have any samples?</div>
        </template><template data-screen="11">
            <div class="bubble right round">Ughh..how much time do I have.</div>
        </template><template data-screen="12">
            <div class="bubble right round">This does not give enough confidence</div>
        </template><template data-screen="13">
            <div class="bubble right round">Uhh...these are just bottles.</div>
        </template><template data-screen="14">
            <div class="bubble right round">Hmm...this looks interesting.</div>
        </template><template data-screen="17">
            <div class="bubble right round">Ohh, Great Packaging Style.</div>
        </template><template data-screen="18">
            <div class="bubble right round">This looks great! Can I look at your social media?</div>
        </template><template data-screen="19">
            <div class="bubble right round">Doesn’t it look inconsistent...</div>
        </template><template data-screen="20">
            <div class="bubble right thought">Oh.. I shouldn’t have asked.</div>
        </template>
        <template data-screen="21" data-choice="0">
            <div class="bubble right round">Ughh..how much time do I have.</div>
        </template><template data-screen="21" data-choice="1">
            <div class="bubble right round">They have a strong branding.</div>
        </template><template data-screen="22">
            <div class="bubble right round">Great content! But where do you send customers who want to learn more and
                actually buy from you?</div>
        </template><template data-screen="23">
            <div class="bubble right round">What if I want to buy something?</div>
        </template><template data-screen="24">
            <div class="bubble right round">Oh, what If I want to look at the products in detail?</div>
        </template><template data-screen="26">
            <div class="bubble right round">You’ve built more than a product - you’ve built a brand. That’s exactly what
                investors want to see.</div>
        </template><template data-screen="27">
            <div class="bubble right round">Here's my card. I'd love to continue this conversation. Let's schedule a
                meeting at my office.</div>
        </template>
    </div>

    <!-- Screen steps: maintain game content here. -->
